<div class="container py-5" style="max-width: 420px">
  <h1 class="h3 fw-bold mb-4 mam-title">Iniciar sesión</h1>

  @if (error()) {
    <div class="alert alert-danger small" role="alert">{{ error() }}</div>
  }

  <form class="card border-2 shadow-sm p-4 mam-card" [formGroup]="form" (ngSubmit)="enviar()">
    <div class="mb-3">
      <label class="form-label small" for="login-user">Usuario</label>
      <input id="login-user" class="form-control" autocomplete="username" formControlName="username" />
    </div>
    <div class="mb-3">
      <label class="form-label small" for="login-pass">Contraseña</label>
      <input
        id="login-pass"
        type="password"
        class="form-control"
        autocomplete="current-password"
        formControlName="password"
      />
    </div>
    <button type="submit" class="btn btn-primary w-100 mam-btn-primary" [disabled]="enviando()">
      @if (enviando()) {
        Entrando…
      } @else {
        Entrar
      }
    </button>
  </form>

  <p class="small text-muted mt-3 mb-0">
    <a routerLink="/inicio">Volver al inicio</a>
  </p>
</div>
