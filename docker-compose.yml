services:
  db:
    image: mysql:8.0
    container_name: manoamano_db
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-manoamano_db}
      MYSQL_USER: ${MYSQL_USER:-manoamano_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-manoamano_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_manoamano}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_manoamano}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: manoamano_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -lc "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: manoamano_frontend
    restart: unless-stopped
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    command: >
      bash -lc "
      npm install &&
      npm run start -- --host 0.0.0.0 --port 4200 --poll 1000
      "

volumes:
  mysql_data:
  frontend_node_modules:
