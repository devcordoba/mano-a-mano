services:
  db:
    image: mysql:8.0
    container_name: manoamano_db
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    # Host 3307 → MySQL interno 3306 (evita choque con MySQL local en 3306)
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: manoamano_backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 90s
    command: >
      bash -lc "
      python manage.py migrate &&
      python manage.py seed_demo &&
      python manage.py runserver 0.0.0.0:8000
      "

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: manoamano_frontend
    restart: unless-stopped
    environment:
      MAM_PROXY_TARGET: http://backend:8000
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      backend:
        condition: service_healthy
    command: >
      bash -lc "
      npm install &&
      npm run start -- --host 0.0.0.0 --port 4200 --poll 1000
      "

volumes:
  mysql_data:
  frontend_node_modules:
